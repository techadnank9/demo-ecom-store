name: RegressionForge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: regressionforge-render-candidate
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  certification:
    name: Deployment Certification
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_FORGECART_API_SERVICE_ID: ${{ vars.RENDER_FORGECART_API_SERVICE_ID }}
      RENDER_FORGECART_WEB_SERVICE_ID: ${{ vars.RENDER_FORGECART_WEB_SERVICE_ID }}
      REGRESSIONFORGE_API_URL: ${{ vars.REGRESSIONFORGE_API_URL }}
      REGRESSIONFORGE_CI_TOKEN: ${{ secrets.REGRESSIONFORGE_CI_TOKEN }}
      FORGECART_STOREFRONT_URL: ${{ vars.FORGECART_STOREFRONT_URL }}
      FORGECART_API_URL: ${{ vars.FORGECART_API_URL }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            RENDER_API_KEY
            RENDER_FORGECART_API_SERVICE_ID
            RENDER_FORGECART_WEB_SERVICE_ID
            REGRESSIONFORGE_API_URL
            REGRESSIONFORGE_CI_TOKEN
            FORGECART_STOREFRONT_URL
            FORGECART_API_URL
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing Actions variable or secret: $name" >&2; exit 2; }
          done

      - name: Deploy exact commit and certify
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloud_certify.py \
            --source-dir "$GITHUB_WORKSPACE" \
            --repository "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --default-branch "${{ github.event.repository.default_branch }}"

      - name: Explain manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Open or update a pull request to deploy and certify an exact candidate SHA."
